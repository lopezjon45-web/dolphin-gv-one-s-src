# Dolphin for Game Vault, One S build: the upstream buildwinrt.yml (skitzellez/Dolphin-GameVault, branch gamevault)
# plus: a single .appx instead of a bundle, signed with a throwaway CN=GamerDad certificate so the console takes it
# as an update of the official package (the repo's DolphinWinRT_TemporaryKey.pfx is CN=SternXD and expired), the
# ISA gate (report only) on the two binaries that run on the console, and a sha256 beside the package.
name: Dolphin WinRT Builds
on:
  push:
    branches:
      - one-s
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # the package goes out as a prerelease; the account's artifact storage is full
    strategy:
      matrix:
        configuration: ['Release']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2

    - name: Extract version string from AppxManifest
      id: extract_version
      run: |
        $manifest = [xml](Get-Content Source\DolphinWinRT\Package.appxmanifest)
        $version = $manifest.Package.Identity.Version
        echo $version
        echo version=$version >> $env:GITHUB_OUTPUT

    - name: Restore NuGet packages
      run: nuget restore Source/dolphin-emu.sln

    # DolphinWinRT.vcxproj packages Sys\**\*.* (Content items), which MSBuild expands when it reads the project,
    # before the project's own PreBuildEvent copies Data\Sys there. On a fresh checkout the glob is empty and the
    # package ships without Sys (GameSettings, shaders, fonts, wiitdb: 2520 files). The author builds on a machine
    # where an earlier build left the folder behind; CI makes the copy first.
    - name: Copy Data\Sys into the project (what the PreBuildEvent does, before MSBuild reads the project)
      shell: pwsh
      run: |
        robocopy Data\Sys Source\DolphinWinRT\Sys /xf *.vsh /E /R:0 /W:0 /NFL /NDL
        if ($LASTEXITCODE -ge 8) { throw "robocopy failed with $LASTEXITCODE" }
        $n = (Get-ChildItem Source\DolphinWinRT\Sys -Recurse -File).Count
        "Sys files: $n"
        if ($n -lt 2000) { throw "Sys has only $n files" }
        exit 0   # robocopy's exit code 1 means "files copied"; the step must not end on it

    - name: Build the project
      run: msbuild Source/dolphin-emu.sln /m /p:PlatformToolset=v143 /t:Restore,Rebuild /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /t:restore,build /p:RestorePackagesConfig=true /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false /p:UapAppxPackageBuildMode=SideloadOnly

    - name: Collect, sign and checksum the package
      id: package
      shell: pwsh
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        # msbuild writes the package under $(SolutionDir)AppPackages: Source\AppPackages\DolphinWinRT\<name>_Test\
        $packages = Get-ChildItem Source\AppPackages, . -Recurse -Include *.appx,*.msix -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'VCLibs|Externals' }
        $built = $packages | Where-Object { $_.Name -match '^DolphinWinRT_' } | Select-Object -First 1
        if (-not $built) {
          Get-ChildItem -Recurse -Include *.appx,*.msix,*.appxbundle,*.msixbundle -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          throw "no DolphinWinRT package found (the files above are every package in the workspace)"
        }
        "package: $($built.FullName)"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($built.FullName)
        $entries = $zip.Entries.Count
        $sys = ($zip.Entries | Where-Object { $_.FullName -like 'Sys/*' }).Count
        $zip.Dispose()
        "package entries: $entries, under Sys/: $sys (the official 1.1.9.120 has 2535 and 2520)"
        if ($sys -lt 2000) { throw "the package is missing Sys/ ($sys entries)" }
        New-Item -ItemType Directory out | Out-Null
        $out = "out\DolphinForGameVault_${version}_x64.appx"
        Copy-Item $built.FullName $out
        $vclibs = Get-ChildItem $built.DirectoryName -Recurse -Include Microsoft.VCLibs.x64.*.appx | Select-Object -First 1
        if ($vclibs) { Copy-Item $vclibs.FullName out\ }
        $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object Name -match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1
        $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=GamerDad" -KeyUsage DigitalSignature -FriendlyName "GamerDad test" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $pw = ConvertTo-SecureString -String "one-s" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pw | Out-Null
        & $signtool sign /fd SHA256 /f cert.pfx /p one-s $out
        if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
        Remove-Item cert.pfx
        $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
        "$hash  $(Split-Path $out -Leaf)" | Set-Content "$out.sha256" -NoNewline
        Get-Content "$out.sha256"
        echo "appx=$out" >> $env:GITHUB_OUTPUT

    - name: Developer command prompt (dumpbin for the ISA gate)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: ISA gate (report only; compare with the profile of a build that ran on the One S)
      shell: pwsh
      run: |
        New-Item -ItemType Directory gate | Out-Null
        # the build's own output (Build\x64\Release\DolphinWinRT\bin, Source\x64\Release\SDL-UWP), with the pdb beside
        # the exe so the gate names the functions; a workspace search when the layout moves
        $exe = Get-Item Build\x64\Release\DolphinWinRT\bin\DolphinWinRT.exe -ErrorAction SilentlyContinue
        if (-not $exe) { $exe = Get-ChildItem Build, Source -Recurse -Filter DolphinWinRT.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1 }
        $pdb = Get-ChildItem Build, Source -Recurse -Filter DolphinWinRT.pdb -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
        $sdl = Get-Item Source\x64\Release\SDL-UWP\SDL3.dll -ErrorAction SilentlyContinue
        if (-not $sdl) { $sdl = Get-ChildItem Source, Build -Recurse -Filter SDL3.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1 }
        if (-not $exe -or -not $sdl) { throw "built binaries not found (exe: $exe, SDL3: $sdl)" }
        "exe: $($exe.FullName)"; "pdb: $($pdb.FullName)"; "SDL3: $($sdl.FullName)"
        Copy-Item $exe.FullName gate\
        if ($pdb) { Copy-Item $pdb.FullName gate\ }
        Copy-Item $sdl.FullName gate\
        python Tools\isa-gate.py --tool dumpbin --report-only gate\DolphinWinRT.exe | Tee-Object out\isa-gate-DolphinWinRT.txt
        python Tools\isa-gate.py --tool dumpbin --report-only gate\SDL3.dll | Tee-Object out\isa-gate-SDL3.txt

    - name: Retry policy and start-up walk test (stand-alone, MSVC)
      shell: cmd
      run: |
        cl /nologo /std:c++20 /EHsc /W3 /I Source\Core /I Source\DolphinWinRT Source\DolphinWinRT\tests\retry_policy_test.cpp /Fe:retry_policy_test.exe
        retry_policy_test.exe

    - name: Publish the package as a prerelease
      if: matrix.configuration == 'Release'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        $tag = "dolphin-one-s-$version-run${{ github.run_id }}"
        $files = Get-ChildItem out -File | ForEach-Object { $_.FullName }
        gh release create $tag --prerelease --target ${{ github.sha }} --title "Dolphin for Game Vault $version (One S build, run ${{ github.run_id }})" --notes "Built from ${{ github.sha }} on windows-2022. Signed with a throwaway CN=GamerDad certificate for one console's Dev Mode install. Not a release." @files
        if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
        "release: $tag"
